---
# Frontend: nginx-exporter sidecar container port "metrics" (9113) -> PodMonitor,
# so the metrics port is not exposed via the public NodePort Service.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: frontend
  namespace: monitoring
  labels: { release: kps }
spec:
  namespaceSelector:
    matchNames: [microservices]
  selector:
    matchLabels:
      app: frontend
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 15s

