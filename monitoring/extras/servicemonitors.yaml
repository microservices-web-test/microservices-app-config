# Scrape targets for the application services (namespace: microservices).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: auth-service
  namespace: monitoring
  labels: { release: kps }
spec:
  namespaceSelector:
    matchNames: [microservices]
  selector:
    matchLabels:
      app: auth-service
  endpoints:
    - port: http          # Service port name; app exposes GET /metrics
      path: /metrics
      interval: 15s
