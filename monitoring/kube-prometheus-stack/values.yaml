# Helm values for kube-prometheus-stack (referenced by argocd/kube-prometheus-stack.application.yaml)

# k3s bundles these control-plane components into one process and does not expose
# their metrics endpoints, so scraping them would only create false "down" alerts.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors / PodMonitors / PrometheusRules from every namespace,
    # not only those labelled with this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    retention: 7d
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  alertmanagerSpec:
    # Full Alertmanager config (SMTP credentials) lives in this SealedSecret-managed Secret.
    configSecret: alertmanager-kps-config
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 128Mi }

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Dashboards in ConfigMaps labelled grafana_dashboard=1 (any namespace) are auto-loaded.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  service:
    type: ClusterIP   # access with: kubectl -n monitoring port-forward svc/kps-grafana 3000:80
  # Grafana 13 uses ~250Mi at startup (was OOM-killed at 256Mi), so give it headroom.
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
  # Skip the background download of preinstalled apps (loki/pyroscope/advisor...)
  # we don't use; saves startup memory and needs no internet access.
  grafana.ini:
    plugins:
      preinstall_disabled: true
      preinstall_auto_update: false

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 64Mi }

prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

